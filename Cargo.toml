[package]
name = "bookcli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "book"
path = "src/main.rs"

[lib]
name = "bookcli"
path = "src/lib.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", features = ["blocking", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
anyhow = "1"
dotenvy = "0.15"
